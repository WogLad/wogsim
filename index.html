<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wogsim</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="fpsCounter">0 FPS</div>

    <div id="testToolsPanel">
        <div class="panel-header">
            <h3>🛠️ Simulation Tester</h3>
            <button id="togglePanelBtn">—</button>
        </div>
        <div class="panel-content">
            <div class="control-group">
                <label>Tool Mode</label>
                <div class="btn-group">
                    <button id="modeInspectBtn" class="mode-btn active">Inspect</button>
                    <button id="modeSpawnBtn" class="mode-btn">Spawn</button>
                    <button id="modeDeleteBtn" class="mode-btn">Remove</button>
                </div>
            </div>
            
            <div id="entitySelectGroup" class="control-group hidden">
                <label>Select Entity</label>
                <div class="btn-group">
                    <button id="entityWoodcutterBtn" class="entity-btn active">Woodcutter (W)</button>
                    <button id="entityFishermanBtn" class="entity-btn">Fisherman (F)</button>
                </div>
            </div>

            <div id="devInspectorGroup" class="control-group">
                <label>Tile/Entity Inspector</label>
                <div id="devInspectorContent" class="inspector-card">
                    <div id="devInspectorTileInfo">Click a tile to inspect.</div>
                    <div id="devInspectorEntitiesSection" class="hidden">
                        <div class="sub-label">Entities on Tile:</div>
                        <div id="devInspectorEntitiesList"></div>
                    </div>
                    <div id="devInspectorDetails" class="hidden"></div>
                </div>
            </div>
            
            <div class="panel-info">
                <div id="entityStats">Total Entities: 0</div>
                <div class="help-text">Click on the canvas to inspect tiles.</div>
            </div>
        </div>
    </div>

    <div id="canvasDiv">
        <br>
        <h1>WOGSIM</h1>
        <br>
        <canvas id="canvas"></canvas>
        <br><br><br>
        <div>
            <button id="togglePauseButton" style="margin-right: 20px;"><b>Toggle Pause</b></button>
            <input type="checkbox" id="debugDrawCheckbox" style="scale: 150%;">
            <span><b>Debug Draw</b></span>
        </div>
    </div>

    <br><br>

    <div id="tileInspectorDiv" style="width: 960px; margin: auto; font-family: menlo, 'Courier New', monospace;">
        <!-- pos: x, y <br>
        type: NULL <br>
        entity_count: 0 <br>
        item_count: 0 -->
    </div>

    <!-- LOAD ALL JS SCRIPTS BELOW -->
    <!-- ------------------------- -->
    <!-- Utility Scripts -->
    <script src='https://joeiddon.github.io/perlin/perlin.js'></script>
    <script src='js/astar.js'></script>
    <script defer src="js/Types.js"></script>
    <script defer src="js/Item.js"></script>
    <script defer src="js/WorldObject.js"></script>

    <!-- World Scripts & Classes -->
    <script defer src="js/WorldTile.js"></script>

    <!-- `Entity Classes -->
    <script defer src="js/Entity.js"></script>
    <script defer src="js/Entities/Human.js"></script>
    <script defer src="js/Entities/Woodcutter.js"></script>
    <script defer src="js/Entities/Fisherman.js"></script>

    <!-- Main Final Scripts -->
    <script defer src="js/main.js"></script>
    <script defer src="js/TestTools.js"></script>
    <script defer src="js/UI.js"></script>
</body>
</html>
